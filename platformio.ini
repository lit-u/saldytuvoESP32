; ============================================================================
;  Isimanusis saldytuvo terminalas — ESP32-S3-CAM (16MB Flash / 8MB OPI PSRAM)
; ============================================================================
[env:esp32-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM ---------------------------------------------------------
; Dauguma ESP32-S3-CAM plokščiu (Waveshare/Lilygo) turi QIO flash + OPI PSRAM.
; Jei tavo plokšte OPI flash (rečiau), pakeisk i "opi_opi".
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Partition lentele pritaikyta 16MB flash (daugiau vietos App + LittleFS/FS).
; Jei tavo arduino-esp32 core versijoje sio failo nera, pasakysiu kaip
; susikurti savo partitions_16MB.csv.
board_build.partitions = default_16MB.csv

; --- Serial / Upload --------------------------------------------------------
; PATIKRINTA pagal oficialia Waveshare schema (ESP32-S3-CAM-XXXX-schematic.pdf,
; produktas "ESP32-S3-CAM-OVxxxx"): siame plokstes modelyje NERA CP2102/CH340
; USB-UART tiltelio. USB-C jungtis eina TIESIAI i ESP32-S3 nuosavo (native)
; USB pinus GPIO19/GPIO20. Todel native USB CDC PRIVALO buti ijungtas —
; kitaip nematysi Serial Monitor.
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; Isjungia deep sleep (main.cpp loop()) kol aktyviai kuriame/flash'iname —
    ; giliame miege native USB CDC dingsta, todel COM prievadas issijungia
    ; TIKSLIAI tada, kai "pio run --target upload" bando prisijungti.
    ; PASALINTI si flag'a pries gamybini (ne-dev) flash'inima.
    -DDEVELOPMENT_MODE=1
    ; LVGL ieskos lv_conf.h saloje "include/" (o ne "../../lv_conf.h"):
    -DLV_CONF_INCLUDE_SIMPLE=1
    ; BUTINA lv_font_conv sugeneruotiems sriftams (zr. lib/lv_fonts_lt/) — jie
    ; #include "lvgl.h" TIK jei sis apibrezta, kitaip krenta i "lvgl/lvgl.h",
    ; kurio siame projekte nera (LVGL prijungtas kaip PlatformIO biblioteka).
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    ; BUTINA: PlatformIO "include/" aplanka automatiskai prideda TIK src/
    ; kompiliavimui, o NE lib/* bibliotekoms — be sito lv_conf.h niekada
    ; nerandamas kompiliuojant lib/lcd_st7796, lib/ui_screens ir kt., ir
    ; LVGL tyliai naudoja default reiksmes (LV_USE_ST7796=0 ir pan.),
    ; kas sukelia "not declared in this scope" klaidas. Patikrinta -v build.
    -Iinclude
    ; Kameros/LVGL/PSRAM budinga optimizacija (nekeisti be reikalo):
    -mfix-esp32-psram-cache-issue

; PASTABA del pirmo flash'inimo: kadangi nera CP2102 auto-reset grandines,
; jei upload nepavyksta ("Failed to connect"), gali reikti rankiniu budu
; ijungti Download rezima: laikant nuspausta BOOT (IO0) mygtuka, trumpai
; paspausti RESET, tada paleisti upload.

; --- Bibliotekos -------------------------------------------------------------
lib_deps =
    esphome/ESPAsyncWebServer-esphome @ ^3.2.2
    esphome/AsyncTCP-esphome @ ^2.1.4
    bblanchon/ArduinoJson @ ^7.1.0
    ; LCD (ST7796) + LVGL: naudojame LVGL v9 nuosava "generic MIPI" SPI
    ; draiveri (lv_st7796_create), NE TFT_eSPI — plokstes LCD reset ir
    ; backlight eina per CH32V003 EXIO (I2C), ko TFT_eSPI standartiskai
    ; nepalaiko be papildomu callback'u. Zr. lib/lcd_st7796/.
    lvgl/lvgl @ ^9.3.0

; SD kortele siame plokstes modelyje jungiama per native SDMMC 1-bit rezima
; (SD_MMC.h, jau idiegtas arduino-esp32 core): CLK=IO16, CMD=IO43, D0=IO44,
; CS NENAUDOJAMAS (patikrinta pagal Waveshare BSP: bsp_sdcard_sdmmc_mount()).
; Kameros valdiklis (esp_camera.h) taip pat idiegtas kartu su core.
